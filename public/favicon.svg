<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <circle
    cx="32"
    cy="32"
    r="30"
    fill="#050505"
  />

  <!-- Ghost -->
  <path
    d="
      M16.5 45
      V29
      C16.5 18.5 23.1 11.5 32 11.5
      C40.9 11.5 47.5 18.5 47.5 29
      V45

      C44.5 43.5 42.2 40.8 39.4 41.5
      C36.7 42.2 35.3 45.5 32 45.5
      C28.7 45.5 27.3 42.2 24.6 41.5
      C21.8 40.8 19.5 43.5 16.5 45
      Z
    "
    fill="#ffffff"
    stroke="#ff1616"
    stroke-width="1.6"
    stroke-linejoin="round"
    filter="url(#redGlow)"
  />

  <!-- Eyes -->
  <ellipse
    cx="26.5"
    cy="28"
    rx="2.3"
    ry="3"
    fill="#080808"
  />

  <ellipse
    cx="37.5"
    cy="28"
    rx="2.3"
    ry="3"
    fill="#080808"
  />

  <!-- Small red mouth -->
  <path
    d="M28.5 35
       C30.5 36.5 33.5 36.5 35.5 35"
    fill="none"
    stroke="#ff1616"
    stroke-width="1.5"
    stroke-linecap="round"
  />

</svg>